# ============================================
# 🚀 PIPELINE CI/CD - Calculadora Windows Pink Purple
# GitHub Actions - Esteira Completa
#
# ESTRATÉGIA:
# - PR em qualquer branch → Lint + Testes Unitários
# - PR aprovado + Testes E2E → Validação completa
# - Merge em develop → Deploy para Staging
# - Merge em main → Deploy para Produção (GitHub Pages)
# ============================================

name: 🧮 CI/CD Pipeline - Calculadora

# ============================================
# GATILHOS (Triggers)
# ============================================
on:
  # Dispara em Push para main e develop
  push:
    branches: [main, develop]
  
  # Dispara em Pull Requests para main e develop
  pull_request:
    branches: [main, develop]

# ============================================
# JOBS (Etapas da Pipeline)
# ============================================
jobs:

  # ──────────────────────────────────────────
  # JOB 1: LINT & TESTES UNITÁRIOS
  # Disparado: Em qualquer PR ou push
  # Objetivo: Feedback rápido sobre qualidade do código
  # ──────────────────────────────────────────
  lint-and-unit-tests:
    name: 🔍 Lint & Testes Unitários
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      # 2. Setup Node.js (ambiente de execução)
      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependências
      - name: 📦 Instalar dependências
        run: npm ci

      # 4. Executar Linter (análise estática)
      - name: 🔎 Executar ESLint
        run: npm run lint || true  # Não bloqueia por enquanto

      # 5. Executar Testes Unitários com cobertura
      - name: 🧪 Executar Testes Unitários (Jest)
        run: npm run test -- --ci --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./test-results

      # 6. Upload do relatório de cobertura
      - name: 📊 Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ──────────────────────────────────────────
  # JOB 2: TESTES E2E (End-to-End)
  # Disparado: Após testes unitários passarem
  # Objetivo: Validar jornada completa do usuário
  # ──────────────────────────────────────────
  e2e-tests:
    name: 🎭 Testes E2E (Cypress)
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests  # Depende do Job 1

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci

      # Servir a aplicação em background
      - name: 🌐 Iniciar servidor HTTP
        run: npx http-server . -p 3000 -c-1 &
      
      # Aguardar o servidor subir
      - name: ⏳ Aguardar servidor
        run: npx wait-on http://localhost:3000 --timeout 30000

      # Executar Cypress em modo headless
      - name: 🎭 Executar Cypress E2E
        uses: cypress-io/github-action@v6
        with:
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 30
          browser: chrome
          headless: true
          spec: tests/e2e/**/*.cy.js

      # Upload de screenshots/vídeos em caso de falha
      - name: 📸 Upload Screenshots (se falhou)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: tests/e2e/screenshots
          retention-days: 3

      - name: 🎬 Upload Vídeos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: tests/e2e/videos
          retention-days: 3

  # ──────────────────────────────────────────
  # JOB 3: DEPLOY STAGING (develop)
  # Disparado: Merge na branch develop
  # Objetivo: Deploy no ambiente de testes/QA
  # ──────────────────────────────────────────
  deploy-staging:
    name: 🟡 Deploy → Staging
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    environment:
      name: staging
      url: https://staging.example.com  # Substituir pela URL real

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🟡 Deploy para ambiente Staging
        run: |
          echo "🚀 Deployando para STAGING..."
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Autor: ${{ github.actor }}"
          echo "✅ Deploy Staging concluído!"
          # Em produção real: rsync, scp, aws s3 sync, vercel deploy, etc.

      - name: 📢 Notificação de Deploy
        run: echo "📧 Notificando time de QA que staging está atualizado"

  # ──────────────────────────────────────────
  # JOB 4: DEPLOY PRODUÇÃO (main)
  # Disparado: Merge na branch main
  # Objetivo: Deploy final para GitHub Pages
  # ──────────────────────────────────────────
  deploy-production:
    name: 🟢 Deploy → Produção (GitHub Pages)
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Permissões necessárias para GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: production
      url: https://luanacristina.github.io/calculadora-windows-pink-purple/

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 📄 Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📦 Upload artefatos para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # Raiz do projeto (index.html, style.css, script.js)

      - name: 🚀 Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: ✅ Confirmar deploy
        run: |
          echo "🎉 DEPLOY DE PRODUÇÃO CONCLUÍDO!"
          echo "🌐 URL: https://luanacristina.github.io/calculadora-windows-pink-purple/"
          echo "📅 Data: $(date)"
          echo "🔖 Commit: ${{ github.sha }}"
